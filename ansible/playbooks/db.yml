- name: Databases (CT 112)
  hosts: db
  pre_tasks:
    - name: Load secrets
      community.sops.load_vars:
        file: "{{ secrets_dir }}/ansible/db.sops.yaml"
      no_log: true
    - name: Load memory and geo database secrets
      community.sops.load_vars:
        file: "{{ secrets_dir }}/{{ item }}/postgres.sops.yaml"
      loop: [memory, geo, flow]
      no_log: true
  roles:
    - common
    - db
    - alloy
