- name: Restart jellyfin
  ansible.builtin.service:
    name: jellyfin
    state: restarted

- name: Reload nftables
  ansible.builtin.service:
    name: nftables
    state: reloaded

- name: Restart gpu exporter
  ansible.builtin.systemd:
    name: nvidia-gpu-exporter
    state: restarted
    daemon_reload: true
