wireguard_interface: wg0
wireguard_network: 10.9.0
wireguard_address: "{{ wireguard_network }}.1/24"
wireguard_port: 51820
wireguard_lan_interface: eth0
wireguard_server_public_key: EVSKfg5Rf73R0va/zpOgkVcZzOTpsaOBSEOkQ71HGik=
wireguard_post_up:
  - sysctl -qw net.ipv4.ip_forward=1
  - iptables -t nat -A POSTROUTING -s {{ wireguard_network }}.0/24 -o {{ wireguard_lan_interface }} -j MASQUERADE
  - iptables -A FORWARD -i %i -j ACCEPT
  - iptables -A FORWARD -o %i -j ACCEPT
wireguard_post_down:
  - iptables -t nat -D POSTROUTING -s {{ wireguard_network }}.0/24 -o {{ wireguard_lan_interface }} -j MASQUERADE
  - iptables -D FORWARD -i %i -j ACCEPT
  - iptables -D FORWARD -o %i -j ACCEPT

wireguard_packages:
  - wireguard-tools
  - iptables
  - qrencode
  - git
  - python3-venv

wgdashboard_repo: https://github.com/donaldzou/WGDashboard.git
wgdashboard_commit: 58fa826862c7a17bdc6a832e1122d14de282e464
wgdashboard_app_version: v4.3.3
wgdashboard_dir: /opt/WGDashboard
wgdashboard_username: ahmed
wgdashboard_port: 10086
wgdashboard_enable_totp: false
wgdashboard_totp_verified: false
wgdashboard_peer_dns: "{{ dns_server }}"
wgdashboard_remote_endpoint: "{{ domain }}"
wgdashboard_peer_mtu: 1420
wgdashboard_peer_keep_alive: 21
