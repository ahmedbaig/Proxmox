# /etc/postgresql/17/main/conf.d/99-baig-tuning.conf
# CT 112 (db, 10.10.20.4) — 6 GB container shared with MariaDB, Mongo, Redis.
# Budget: Postgres 1 GB, MariaDB 1.5 GB, Mongo 1 GB, Redis 256 MB.

listen_addresses = '*'
port = 5432
max_connections = 100

shared_buffers = 1GB
effective_cache_size = 2GB
work_mem = 16MB
maintenance_work_mem = 256MB

# rootfs is LVM-thin on NVMe
random_page_cost = 1.1
effective_io_concurrency = 200

wal_compression = on
checkpoint_completion_target = 0.9
max_wal_size = 2GB
min_wal_size = 256MB

# anything over a second is worth seeing while the migration settles
log_min_duration_statement = 1000
log_line_prefix = '%m [%p] %q%u@%d '
