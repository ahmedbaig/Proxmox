# /etc/postgresql/17/main/conf.d/99-baig-tls.conf
# TLS is offered, not required: pg_hba still accepts non-TLS connections from
# the Servers and Trusted VLANs, so existing clients keep working. Clients that
# want it can ask for sslmode=require and get a certificate that actually
# validates against db.servers.baig.network, which the wildcard now covers.
ssl = on
ssl_cert_file = '/var/lib/postgresql/baig.crt'
ssl_key_file = '/var/lib/postgresql/baig.key'
ssl_min_protocol_version = 'TLSv1.2'
