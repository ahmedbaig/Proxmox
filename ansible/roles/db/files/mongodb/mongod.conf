# /etc/mongod.conf — CT 112 (db, 10.10.20.4)
# Percona Server for MongoDB 8.0. Source was percona-server-mongodb 8.0.8-3 on
# the Mac mini; only the DAU database (134 MB) carries over.

storage:
  dbPath: /var/lib/mongodb
  engine: wiredTiger
  wiredTiger:
    engineConfig:
      # Default would claim (6 GB - 1 GB) / 2 = 2.5 GB and starve Postgres and
      # MariaDB. Budget for this container is Postgres 1 GB, MariaDB 1.5 GB,
      # Mongo 1 GB, Redis 256 MB.
      cacheSizeGB: 1

systemLog:
  destination: file
  logAppend: true
  path: /var/log/mongodb/mongod.log

net:
  port: 27017
  # Reachable from the Servers and Trusted VLANs. Firewall zones already
  # restrict who can route here; auth below is the second layer.
  bindIp: 0.0.0.0

security:
  authorization: enabled

processManagement:
  timeZoneInfo: /usr/share/zoneinfo
