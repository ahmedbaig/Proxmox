- name: CouchDB signing key
  ansible.builtin.shell: |
    set -euo pipefail
    { curl -fsSL https://couchdb.apache.org/repo/keys.asc \
      || curl -fsSL https://apache.jfrog.io/artifactory/couchdb-deb/repo/keys.asc ; } \
      | gpg --batch --yes --dearmor -o /usr/share/keyrings/couchdb-archive-keyring.gpg
  args:
    executable: /bin/bash
    creates: /usr/share/keyrings/couchdb-archive-keyring.gpg

- name: CouchDB repository
  ansible.builtin.copy:
    src: apt/couchdb.list
    dest: /etc/apt/sources.list.d/couchdb.list
    owner: root
    group: root
    mode: "0644"
  register: db_couchdb_repo

- name: CouchDB standalone install answers
  ansible.builtin.debconf:
    name: couchdb
    question: "{{ item.question }}"
    value: "{{ item.value }}"
    vtype: "{{ item.vtype }}"
  loop:
    - { question: couchdb/mode, value: standalone, vtype: select }
    - { question: couchdb/bindaddress, value: 0.0.0.0, vtype: string }

- name: Installed packages
  ansible.builtin.package_facts:

- name: percona-release tool
  ansible.builtin.apt:
    deb: https://repo.percona.com/apt/percona-release_latest.generic_all.deb
  when: "'percona-release' not in ansible_facts.packages"

- name: Percona Server for MongoDB 8.0 repository
  ansible.builtin.command: percona-release enable psmdb-80 release
  args:
    creates: /etc/apt/sources.list.d/percona-psmdb-80-release.list
  register: db_percona_repo

- name: Refresh apt after repository changes
  ansible.builtin.apt:
    update_cache: true
  when: db_couchdb_repo is changed or db_percona_repo is changed
