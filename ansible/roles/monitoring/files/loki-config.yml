# /etc/loki/config.yml  —  CT 114 (metrics, 10.10.20.5)
#
# The packaged default puts path_prefix at /tmp/loki, which loses every stored
# log on reboot. Anything built on top of that — least of all security
# dashboards, where the value is in history — would quietly reset. Storage is
# on /var/lib/loki with 30 days of enforced retention instead.

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  path_prefix: /var/lib/loki
  storage:
    filesystem:
      chunks_directory: /var/lib/loki/chunks
      rules_directory: /var/lib/loki/rules
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # 30 days. The rootfs is 40 GB and a lab this size produces well under a
  # gigabyte a month of journald, so this is comfortable.
  retention_period: 720h
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
  max_streams_per_user: 10000
  max_line_size: 256kb
  allow_structured_metadata: true
  volume_enabled: true
  reject_old_samples: true
  reject_old_samples_max_age: 168h

# Retention is only actually applied when the compactor is running with
# retention_enabled. Setting retention_period alone deletes nothing.
compactor:
  working_directory: /var/lib/loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
  compaction_interval: 10m

ruler:
  storage:
    type: local
    local:
      directory: /var/lib/loki/rules
  rule_path: /var/lib/loki/rules-temp
  enable_api: true

analytics:
  reporting_enabled: false
