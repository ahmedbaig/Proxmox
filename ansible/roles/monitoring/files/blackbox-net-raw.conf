# ICMP probes need raw sockets. An unprivileged LXC will not let the container
# set net.ipv4.ping_group_range, so the capability is granted to the service
# instead. CAP_NET_RAW is namespaced — this applies only inside this
# container's network namespace.
[Service]
AmbientCapabilities=CAP_NET_RAW
CapabilityBoundingSet=CAP_NET_RAW
